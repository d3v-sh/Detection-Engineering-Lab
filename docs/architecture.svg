<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="560" fill="#0d1117"/>

  <text x="490" y="35" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Detection Engineering Lab — Network Architecture</text>

  <!-- NAT Network box -->
  <rect x="40" y="70" width="620" height="300" rx="10" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="60" y="95" fill="#3fb950" font-size="13" font-weight="bold">VirtualBox NAT Network — 10.0.2.0/24 (internet egress + inter-VM)</text>

  <!-- DC -->
  <rect x="70" y="120" width="180" height="130" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="145" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Domain Controller</text>
  <text x="160" y="165" text-anchor="middle" fill="#c9d1d9" font-size="11">Windows Server 2022</text>
  <text x="160" y="182" text-anchor="middle" fill="#c9d1d9" font-size="11">AD DS + DNS</text>
  <text x="160" y="199" text-anchor="middle" fill="#c9d1d9" font-size="11">Sysmon + Wazuh agent</text>
  <text x="160" y="222" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="bold">10.0.2.4</text>
  <text x="160" y="240" text-anchor="middle" fill="#8b949e" font-size="10">NAT Network only</text>

  <!-- Wazuh server -->
  <rect x="280" y="120" width="180" height="130" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="370" y="145" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Wazuh Server</text>
  <text x="370" y="165" text-anchor="middle" fill="#c9d1d9" font-size="11">Ubuntu Server</text>
  <text x="370" y="182" text-anchor="middle" fill="#c9d1d9" font-size="11">Docker: manager +</text>
  <text x="370" y="199" text-anchor="middle" fill="#c9d1d9" font-size="11">indexer + dashboard</text>
  <text x="370" y="222" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="bold">10.0.2.3</text>
  <text x="370" y="240" text-anchor="middle" fill="#8b949e" font-size="10">NAT Network only</text>

  <!-- Workstation -->
  <rect x="490" y="120" width="180" height="130" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="580" y="145" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="bold">Workstation</text>
  <text x="580" y="165" text-anchor="middle" fill="#c9d1d9" font-size="11">Windows 10 (domain-joined)</text>
  <text x="580" y="182" text-anchor="middle" fill="#c9d1d9" font-size="11">Sysmon + Wazuh agent</text>
  <text x="580" y="199" text-anchor="middle" fill="#c9d1d9" font-size="11">Dual-homed</text>
  <text x="580" y="222" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="bold">10.0.2.6</text>
  <text x="580" y="240" text-anchor="middle" fill="#8b949e" font-size="10">NAT + bridged to LAN</text>

  <!-- connections within NAT network -->
  <line x1="250" y1="185" x2="280" y2="185" stroke="#3fb950" stroke-width="2"/>
  <line x1="460" y1="185" x2="490" y2="185" stroke="#3fb950" stroke-width="2"/>

  <!-- Bridge line down from workstation to LAN -->
  <line x1="580" y1="250" x2="580" y2="330" stroke="#a371f7" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="700" y="295" fill="#a371f7" font-size="11">bridged adapter</text>
  <text x="700" y="311" fill="#a371f7" font-size="11">(pivot boundary)</text>

  <!-- Local LAN box -->
  <rect x="440" y="400" width="280" height="120" rx="10" fill="none" stroke="#f78166" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="580" y="425" text-anchor="middle" fill="#f78166" font-size="13" font-weight="bold">Physical LAN</text>

  <line x1="580" y1="330" x2="580" y2="400" stroke="#a371f7" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Attacker -->
  <rect x="480" y="440" width="200" height="65" rx="8" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="580" y="465" text-anchor="middle" fill="#f78166" font-size="13" font-weight="bold">Attacker (Kali)</text>
  <text x="580" y="483" text-anchor="middle" fill="#c9d1d9" font-size="11">Separate physical machine</text>
  <text x="580" y="497" text-anchor="middle" fill="#8b949e" font-size="10">reaches workstation directly</text>

  <!-- Legend / note -->
  <text x="60" y="540" fill="#8b949e" font-size="11">Note: the DC is only reachable via the NAT Network — an attacker on the LAN must pivot through the workstation to reach it.</text>
</svg>
